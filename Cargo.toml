[package]
name = "caspay"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = { version = "2.4.0", features = [], default-features = false }

[dev-dependencies]
odra-test = { version = "2.4.0", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.4.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.4.0", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.4.0", optional = true }

# Binaries excluded from tests
# Note: These have #![no_main] and cannot be tested with cargo test
# Use cargo odra build for WASM generation
# Use cargo run --bin deploy_testnet --features=livenet for deployment

[[bin]]
name = "deploy_testnet"
path = "bin/deploy_testnet.rs"
required-features = ["livenet"]

[[bin]]
name = "deploy_mainnet"
path = "bin/deploy_mainnet.rs"
required-features = ["livenet"]

[[bin]]
name = "caspay_build_contract"
path = "bin/build_contract.rs"

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3

[features]
livenet = ["odra-casper-livenet-env"]

[lints.rust]
unexpected_cfgs = "allow"
